---
layout: default
---
<article>
  <header class="note-header">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="{{ '/' | relative_url }}">Home</a> &gt; <a href="{{ '/notes/' | relative_url }}">Notes</a>
    </nav>
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y-%m-%d' }}</time>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  {% include see-also.html current_note=page %}
</article>

name: Publish blog Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.label.name == 'publish' &&
      github.event.issue.user.login == github.repository_owner &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Pacific/Auckland
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script --locked

      - name: Verify Rust tooling
        run: |
          rustc --version
          cargo --version
          rust-script --version

      - name: Generate Jekyll post
        id: post
        run: |
          rustc .github/scripts/publish_issue.rs -o /tmp/publish_issue
          /tmp/publish_issue

      - name: Commit generated post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.post.outputs.post_path }}"
          git commit -m "Publish blog post from Issue #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark Issue as published
        uses: actions/github-script@v7
        env:
          POST_URL: ${{ steps.post.outputs.post_url }}
        with:
          script: |
            const issue = context.issue;
            try {
              await github.rest.issues.createLabel({
                ...issue,
                name: 'published',
                color: '0e8a16',
                description: 'This Issue has been published as a blog post'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.createComment({
              ...issue,
              body: `Published: ${process.env.POST_URL}`
            });
            await github.rest.issues.addLabels({
              ...issue,
              labels: ['published']
            });
